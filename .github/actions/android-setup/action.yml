name: Aro Android build environment
description: Install the SDK and use the repository Gradle wrapper
runs:
  using: composite
  steps:
    - name: Free runner disk for Android images and APKs
      shell: bash
      run: |
        df -h /
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
        df -h /
    - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        distribution: temurin
        java-version: '21'
    - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      with:
        packages: platform-tools
    - shell: bash
      run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
    - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
