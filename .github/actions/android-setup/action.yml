name: Aro Android build environment
description: Install the SDK and use the repository Gradle wrapper
runs:
  using: composite
  steps:
    - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        distribution: temurin
        java-version: '21'
    - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
    - shell: bash
      run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0'
    - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
