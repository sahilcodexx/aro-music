name: Aro release candidate
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aro-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/android-setup
      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ARO_KEYSTORE_BASE64 }}
          ARO_STORE_PASSWORD: ${{ secrets.ARO_STORE_PASSWORD }}
          ARO_KEY_PASSWORD: ${{ secrets.ARO_KEY_PASSWORD }}
          ARO_KEY_ALIAS: ${{ secrets.ARO_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$ARO_STORE_PASSWORD"
          test -n "$ARO_KEY_PASSWORD"
          test -n "$ARO_KEY_ALIAS"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aro-release.jks"
      - name: Validate and build signed APKs and bundle
        env:
          ARO_KEYSTORE_PATH: ${{ runner.temp }}/aro-release.jks
          ARO_STORE_PASSWORD: ${{ secrets.ARO_STORE_PASSWORD }}
          ARO_KEY_PASSWORD: ${{ secrets.ARO_KEY_PASSWORD }}
          ARO_KEY_ALIAS: ${{ secrets.ARO_KEY_ALIAS }}
        run: ./gradlew :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease :app:bundleRelease --no-daemon --console=plain
      - name: Verify signatures and prepare release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for apk in app/build/outputs/apk/release/*.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          done
          python3 scripts/check-apk-native.py app/build/outputs/apk/release/*.apk
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk app/build/outputs/bundle/release/*.aab dist/
          (cd dist && sha256sum *.apk *.aab > SHA256SUMS.txt)
          version=$(sed -n 's/^APP_VERSION_NAME=//p' gradle.properties)
          gh release create "v$version" dist/* --target "$GITHUB_SHA" --title "Aro $version" --notes-file CHANGELOG.md --draft --prerelease
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: aro-signed-release-candidate
          path: dist/
          if-no-files-found: error
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/aro-release.jks"
