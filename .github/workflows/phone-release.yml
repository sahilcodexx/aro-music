name: Aro release candidate
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aro-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Report licensing status
        run: |
          if grep -q 'Unresolved licensing:' LICENSE_STATUS.md; then
            echo '::warning::Component licensing remains unresolved. Preserve original notices; build validation does not establish redistribution rights.'
          fi
      - uses: ./.github/actions/android-setup
      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ARO_KEYSTORE_BASE64 }}
          ARO_STORE_PASSWORD: ${{ secrets.ARO_STORE_PASSWORD }}
          ARO_KEY_PASSWORD: ${{ secrets.ARO_KEY_PASSWORD }}
          ARO_KEY_ALIAS: ${{ secrets.ARO_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$ARO_STORE_PASSWORD"
          test -n "$ARO_KEY_PASSWORD"
          test -n "$ARO_KEY_ALIAS"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aro-release.jks"
      - name: Validate and build signed APKs and bundle
        env:
          ARO_KEYSTORE_PATH: ${{ runner.temp }}/aro-release.jks
          ARO_STORE_PASSWORD: ${{ secrets.ARO_STORE_PASSWORD }}
          ARO_KEY_PASSWORD: ${{ secrets.ARO_KEY_PASSWORD }}
          ARO_KEY_ALIAS: ${{ secrets.ARO_KEY_ALIAS }}
        run: ./gradlew :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease --no-daemon --console=plain
      - name: Preserve split APKs and build the app bundle without APK splits
        env:
          ARO_KEYSTORE_PATH: ${{ runner.temp }}/aro-release.jks
          ARO_STORE_PASSWORD: ${{ secrets.ARO_STORE_PASSWORD }}
          ARO_KEY_PASSWORD: ${{ secrets.ARO_KEY_PASSWORD }}
          ARO_KEY_ALIAS: ${{ secrets.ARO_KEY_ALIAS }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/
          cp app/build/outputs/apk/release/output-metadata.json dist/
          rm -rf app/build/intermediates/shrunk_resources_proto_format/release
          ./gradlew :app:bundleRelease -Paro.enableAbiSplits=false --no-daemon --console=plain
      - name: Verify signatures and prepare release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for apk in dist/*.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          done
          python3 scripts/check-apk-native.py dist/*.apk
          mkdir -p dist
          cp app/build/outputs/bundle/release/*.aab dist/
          (cd dist && sha256sum *.apk *.aab > SHA256SUMS.txt)
          version=$(sed -n 's/^APP_VERSION_NAME=//p' gradle.properties)
          # Every public APK is a complete installer with a clear architecture name.
          python3 scripts/prepare-release.py --source dist --destination publish --version "$version" --repository "$GITHUB_REPOSITORY" --notes release-notes.md
          printf '\nDevelopment testing release. See LICENSE_STATUS.md and RELEASE_CHECKLIST.md for unresolved distribution rights and verification limits.\n' >> release-notes.md
          if gh release view "v$version" --json isDraft,targetCommitish >/dev/null 2>&1; then
            same_draft=$(gh release view "v$version" --json isDraft,targetCommitish --jq ".isDraft and (.targetCommitish == \"$GITHUB_SHA\")")
            if [ "$same_draft" != true ]; then
              echo 'Existing release is published or targets another commit. Increase APP_VERSION_NAME before shipping another build.'
              exit 1
            fi
            gh release upload "v$version" publish/*.apk publish/SHA256SUMS.txt --clobber
            gh release edit "v$version" --notes-file release-notes.md
          else
            gh release create "v$version" publish/*.apk publish/SHA256SUMS.txt --target "$GITHUB_SHA" --title "Aro $version" --notes-file release-notes.md --draft --prerelease
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: aro-signed-release-candidate
          path: dist/
          if-no-files-found: error
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/aro-release.jks"
