name: Android validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Album query regression checks
        run: python3 -m unittest discover -s scripts/tests -p 'test_library_album_queries.py'
      - uses: ./.github/actions/android-setup
      - name: Unit tests, lint, and phone APKs
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --console=plain
      - name: Check ARM64 page alignment
        run: python3 scripts/check-apk-native.py app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: aro-validation-${{ github.sha }}
          path: |
            app/build/reports/
            app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: warn
  devices:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [30, 36]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/android-setup
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disk-size: 2048M
          ram-size: 2048M
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest -Paro.enableAbiSplits=false -Pandroid.testInstrumentationRunnerArguments.class=com.aro.music.playback.NativePlaybackCompatibilityTest,com.aro.music.data.database.MusicDaoTest,com.aro.music.data.database.AroDatabaseMigrationTest,com.aro.music.ui.theme.ArtworkThemeContrastTest,com.aro.music.presentation.components.PersonalShelvesLayoutTest,com.aro.music.presentation.components.AppUpdateDialogDeviceTest,com.aro.music.data.stats.StatsHistoryCompatibilityDeviceTest,com.aro.music.presentation.sharing.SongShareCardDeviceTest,com.aro.music.presentation.sharing.SongShareSheetLayoutDeviceTest,com.aro.music.presentation.sharing.LyricCardSelectionDeviceTest,com.aro.music.presentation.components.EditHomeSheetDeviceTest,com.aro.music.presentation.components.PlayerArtworkMotionLayoutTest --no-daemon --console=plain
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: aro-device-api-${{ matrix.api }}
          path: app/build/reports/androidTests/
          if-no-files-found: warn
