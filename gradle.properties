android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.builtInKotlin=true
android.newDsl=true
ksp.useKSP2=true
APP_VERSION_CODE=20
APP_VERSION_NAME=1.0.3

# More headroom now that we have swap
org.gradle.jvmargs=-Xmx3g -Xms256m -XX:MaxMetaspaceSize=768m -Dkotlin.incremental=false -Dkotlin.compiler.execution.strategy=in-process
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process

# AGP 9 defaults to host tests only for the instrumented build type.
# Keep release host tests available for the signed-release validation workflow.
android.onlyEnableUnitTestForTheTestedBuildType=false
